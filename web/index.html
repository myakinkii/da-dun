<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIDI Sketchbook</title>
<!-- Built from web/index.html by build.js; edit the sources, not dist/. -->
<style>
:root {
  --bg: #F3F5F8; --ink: #17202E; --muted: #5B6676; --panel: #FFFFFF; --line: #D5DCE4;
  --sel: #E4E9EF; --accent: #2F5BD3; --accent-ink: #FFFFFF; --ok: #2E7D4F; --warn: #A15C00; --err: #C0362C;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121821; --ink: #E4E9F0; --muted: #93A0B2; --panel: #1A222E; --line: #2B3645;
  --sel: #263142; --accent: #7EA2FF; --accent-ink: #0E1420; --ok: #6CCB93; --warn: #F0B45A; --err: #FF7B6E;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121821; --ink: #E4E9F0; --muted: #93A0B2; --panel: #1A222E; --line: #2B3645;
  --sel: #263142; --accent: #7EA2FF; --accent-ink: #0E1420; --ok: #6CCB93; --warn: #F0B45A; --err: #FF7B6E;
  color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.bar .spacer { flex: 1; }
select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
select { max-width: 100%; }
button:hover, select:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea {
  display: block; width: 100%; min-height: 220px; resize: vertical; padding: 12px 14px;
  font: 0.92rem/1.6 var(--mono); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; tab-size: 2; white-space: pre; overflow: auto;
}
.status { min-height: 1.6em; margin: 8px 0 16px; font-size: 0.9rem; }
.status .ok { color: var(--ok); }
.status .err { color: var(--err); font-weight: 600; }
.status ul { margin: 4px 0 0; padding: 0; list-style: none; }
.status li button { border: 0; background: none; padding: 1px 0; color: var(--warn); text-align: left; cursor: pointer; font: inherit; }
.status li button:hover { text-decoration: underline; }
midi-player { display: block; width: 100%; margin-bottom: 10px; }
.viz { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; min-height: 60px; }
.tabs { display: flex; gap: 4px; margin: 22px 0 8px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--sel); color: var(--ink); }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; max-height: 420px; font: 0.82rem/1.55 var(--mono); margin: 0; }
.banner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 0; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--panel); font-size: 0.9rem; }
.banner[hidden] { display: none; }
.banner span { flex: 1; min-width: 12em; }
.hint { color: var(--muted); font-size: 0.85rem; margin: 6px 0 0; }
kbd { font: 0.8rem var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <select id="song" aria-label="Song"></select>
    <button id="new">New sketch</button>
    <button id="revert" title="Undo all your edits to this example">Revert</button>
    <button id="delete" hidden>Delete</button>
    <span class="spacer"></span>
    <button class="primary" id="play">Play from start</button>
  </div>
  <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Notation"></textarea>
  <div class="banner" id="banner" hidden role="status"><span id="banner-text"></span><button id="banner-load" hidden>Load it</button><button id="banner-keep" hidden>Keep mine</button><button id="banner-close">OK</button></div>
  <p class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> plays from the start. <span id="sync">Edits are saved in this browser as you type.</span></p>
  <div class="status" id="status" aria-live="polite"></div>

  <midi-player id="player" visualizer="#viz"></midi-player>
  <div class="viz"><midi-visualizer type="piano-roll" id="viz"></midi-visualizer></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-show="csv" aria-selected="true">CSV</button>
    <button role="tab" data-show="guide" aria-selected="false">Notation guide</button>
  </div>
  <pre id="text"></pre>
  <div class="bar" style="margin-top:10px">
    <span class="hint" style="margin:0">Save as:</span>
    <button data-save="mid">MIDI</button>
    <button data-save="csv">CSV</button>
    <button data-save="txt">Notation</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.58"></script>
<script src="https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1/es6/core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-midi-player@1.4.0"></script>

</body>
</html>
